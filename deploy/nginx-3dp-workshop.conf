# 既存の server { listen 443 ssl; server_name <hostname>; ... } ブロックの中に追加するスニペット。
# 同一オリジンでエディタ(static export)とアプリを配信する。

# エディタ (tukumana-layerling の static export)。具体的な location を先に書く。
location ^~ /3dp/editor/ {
    alias /var/www/3dp-workshop-editor/;
    index index.html;
    try_files $uri $uri/ /3dp/editor/index.html;
    add_header Cache-Control "public, max-age=300";
}

# 旧 URL (/3dp-workshop/...) からの恒久リダイレクト。参加用 QR コードや共有リンクを生かすため残す。
location ^~ /3dp-workshop {
    rewrite ^/3dp-workshop(.*)$ /3dp$1 permanent;
}

# Next.js アプリ (PM2: 127.0.0.1:8010)
location /3dp {
    client_max_body_size 60m;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
