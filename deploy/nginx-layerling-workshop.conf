# 既存の server { listen 443 ssl; server_name tukumana.si.aoyama.ac.jp; ... } ブロックの中に追加するスニペット。
# 同一オリジンでエディタ(static export)とアプリを配信する。

# エディタ (tukumana-layerling の static export)。具体的な location を先に書く。
location /layerling-workshop/editor/ {
    alias /var/www/layerling-workshop-editor/;
    index index.html;
    try_files $uri $uri/ /layerling-workshop/editor/index.html;
    # wasm の MIME
    types { application/wasm wasm; }
    add_header Cache-Control "public, max-age=300";
}

# Next.js アプリ (PM2: 127.0.0.1:8010)
location /layerling-workshop/ {
    client_max_body_size 60m;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
